[package]
name = "schedule-bot"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ab_glyph = "0.2"
anyhow = "1"
axum = "0.8"
object_store = { version = "0.12", features = ["aws"] }
chrono.workspace = true
chrono-tz = "0.10"
dotenvy = "0.15"
dptree = "0.5"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
imageproc = { version = "0.27", default-features = false, features = ["text"] }
hex = "0.4"
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }
schedule-parser = { path = "../schedule-parser" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "migrate", "macros"] }
subtle = "2"
teloxide = { version = "0.17", features = ["macros", "ctrlc_handler"] }
thiserror.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
